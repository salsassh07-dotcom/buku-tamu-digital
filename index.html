<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 30px 15px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0001;
    }
    h1 { text-align: center; color: #2563eb; }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .item {
      background: #f1f5f9;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Buku Tamu Digital</h1>
    <form id="formTamu">
      <input id="nama" placeholder="Nama lengkap"
             maxlength="100" required>
      <textarea id="keperluan"
                placeholder="Keperluan"
                maxlength="300" required></textarea>
      <button type="submit">Kirim Data</button>
    </form>

    <p id="status"></p>
    <h3>Daftar Pengunjung</h3>
    <div id="daftar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://iecrmfxmbrowohblpakx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Nhb-e5AWHNkv7IJqQcyQQQ_q8LTYtrb";

    const db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const form = document.getElementById("formTamu");
    const status = document.getElementById("status");
    const daftar = document.getElementById("daftar");

    async function tampilkanData() {
      daftar.replaceChildren();

      const { data, error } = await db
        .from("buku_tamu")
        .select("id, nama, keperluan, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        status.textContent = "Gagal mengambil data.";
        return;
      }

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";

        const nama = document.createElement("strong");
        nama.textContent = item.nama;

        const keperluan = document.createElement("p");
        keperluan.textContent = item.keperluan;

        div.append(nama, keperluan);
        daftar.appendChild(div);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Menyimpan data...";

      const nama = document.getElementById("nama").value.trim();
      const keperluan =
        document.getElementById("keperluan").value.trim();

      const { error } = await db.from("buku_tamu").insert([
        { nama, keperluan }
      ]);

      if (error) {
        status.textContent = "Data gagal disimpan.";
        return;
      }

      status.textContent = "Data berhasil disimpan!";
      form.reset();
      await tampilkanData();
    });

    tampilkanData();
  </script>
</body>
</html>
